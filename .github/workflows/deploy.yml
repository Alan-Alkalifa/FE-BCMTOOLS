name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Build and push image
        env:
          IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/bcm-frontend:${{ github.sha }}
        run: |
          docker build --target prod --build-arg "APP_VERSION=${{ github.sha }}" -t "$IMAGE" .
          docker push "$IMAGE"

  dev:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      image-tag: ${{ github.sha }}

  test:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: test
      image-tag: ${{ github.sha }}

  prod:
    needs: test
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      image-tag: ${{ github.sha }}
