# Checks every pull request into DEV-BCMTOOLS and PROD-BCMTOOLS. Branch rules require each job
# below by name (lint, typecheck, build, e2e, security, secrets). The deploy workflows call this
# file first, so nothing is deployed without the same checks.
name: CI

on:
  pull_request:
    branches: [DEV-BCMTOOLS, PROD-BCMTOOLS]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: .output/public
          retention-days: 7

  # Playwright UI tests (API mocked in the browser) against the production nginx image.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run production image
        run: |
          docker build --target prod -t bcm-frontend .
          docker run -d -p 3000:8080 -e BACKEND_URL=http://127.0.0.1:9 bcm-frontend
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=ui
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # High or critical advisories in the packages the app ships (not dev tools). Reported as a
      # warning until the repository variable NPM_AUDIT_BLOCKING is true (set it once the current
      # advisories are fixed; then a new one fails the pull request).
      - name: npm audit
        continue-on-error: ${{ vars.NPM_AUDIT_BLOCKING != 'true' }}
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::npm audit found high or critical advisories (npm audit fix, in its own pull request)."
            exit 1
          fi

  # No key, password or token in the change (.env files included).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}~1..{0}', github.sha) }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --log-opts="$RANGE" .
