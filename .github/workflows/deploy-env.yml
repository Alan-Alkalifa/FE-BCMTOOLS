name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    env:
      TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.FRONTEND_APP_NAME }}
          images: ${{ vars.ACR_NAME }}.azurecr.io/bcm-frontend:${{ env.TAG }}

      - name: Wait for new version
        if: vars.APP_URL != ''
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "${{ vars.APP_URL }}/version.json" | grep -Eq "\"version\": *\"$TAG\""; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for version $TAG"
          exit 1

      - uses: actions/setup-node@v4
        if: vars.APP_URL != ''
        with:
          node-version: 22
          cache: npm
      - name: Smoke test
        if: vars.APP_URL != ''
        env:
          E2E_BASE_URL: ${{ vars.APP_URL }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke
