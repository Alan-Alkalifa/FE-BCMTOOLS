# One Vercel deployment from GitHub Actions (Vercel's own Git deployments are off for

# DEV-BCMTOOLS and PROD-BCMTOOLS in vercel.json). Called by deploy-dev.yml and deploy-prod.yml.
#   target preview    = DEV: a Preview deployment, then the fixed DEV domain (DEV_DOMAIN) points at it
#   target production = PROD
# Then it waits until the site serves /version.json with this commit and runs the smoke tests.
name: Vercel deployment

on:
  workflow_call:
    inputs:
      target:
        description: preview or production
        required: true
        type: string
      url:
        description: The site the smoke tests open (DEV_URL or PROD_URL)
        required: true
        type: string
      alias:
        description: Domain to point at the new preview deployment (DEV only)
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@${{ vars.VERCEL_CLI_VERSION || 'latest' }}
      APP_VERSION: ${{ github.sha }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PROD_FLAG: ${{ inputs.target == 'production' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pull the project settings and ${{ inputs.target }} environment variables
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="${{ inputs.target }}" --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes "$VERCEL_CLI" build ${PROD_FLAG:+"$PROD_FLAG"} --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt ${PROD_FLAG:+"$PROD_FLAG"} --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Point ${{ inputs.alias }} at it
        if: inputs.alias != ''
        # The REST API, not `vercel alias set`: the CLI looks up the token's user first, which a
        # team-scoped token cannot do ("User not found"). Same token, same team as the deploy.
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ inputs.alias }}
        run: |
          set -o pipefail
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl --fail-with-body -sS -H "$auth" "$api/v13/deployments/${DEPLOY_URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl --fail-with-body -sS -X POST -H "$auth" -H "Content-Type: application/json" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" -d "{\"alias\":\"$ALIAS\"}" | jq -r '"Aliased " + .alias'
      - name: Wait for ${{ inputs.url }}/version.json to show this commit
        env:
          SITE: ${{ inputs.url }}
        run: |
          for _ in $(seq 1 36); do
            if curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "$SITE/version.json" | grep -q "\"$APP_VERSION\""; then
              echo "$SITE serves $APP_VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE doesn't serve $APP_VERSION after 6 minutes. After a Vercel rollback, production domains stay on the old deployment until it is promoted: vercel promote ${{ steps.deploy.outputs.url }}"
          exit 1
      - name: Install Chromium
        # The browser comes from Playwright's CDN. Its system packages come from apt, whose Ubuntu
        # mirrors are sometimes unreachable from the runner ("Temporary failure resolving
        # archive.ubuntu.com"); the runner image already ships Chrome's libraries (only some fonts
        # are missing), so the job goes on with a warning and the tests show if anything is really
        # missing. With DNS down apt hangs for minutes instead of failing, so: skip apt outright
        # when the mirror doesn't resolve, make apt give up fast, and cap each attempt with
        # `timeout` so the fallback is always reached before the step's own timeout
        # (worst case ~2 min download + 2 x 4 min + 20 s < 12 min).
        timeout-minutes: 12
        run: |
          npx playwright install chromium

          if ! getent hosts archive.ubuntu.com >/dev/null; then
            echo "::warning::Ubuntu mirrors unresolvable; skipped Chromium's system packages, using the runner image's."
            exit 0
          fi

          printf 'Acquire::Retries "0";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast-fail >/dev/null

          for attempt in 1 2; do
            if timeout --kill-after=15s 4m npx playwright install-deps chromium; then exit 0; fi
            echo "install-deps attempt $attempt failed or timed out"
            sleep 20
          done
          echo "::warning::Couldn't install Chromium's system packages (apt unreachable); using the runner image's."
      - name: Smoke tests (real backend through the middleware)
        env:
          E2E_BASE_URL: ${{ inputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --project=smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ inputs.target }}
          path: playwright-report
