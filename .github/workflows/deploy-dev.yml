# DEV: every merge into DEV-BCMTOOLS runs CI, deploys a Vercel Preview and points the fixed DEV
# domain at it. A green deploy marks the commit with the status `deploy-dev`, which deploy-prod.yml
# looks for before PROD. Also runs by hand (e.g. on a hotfix/* branch before it goes to PROD).
name: Deploy DEV

on:
  push:
    branches: [DEV-BCMTOOLS]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      target: preview
      url: ${{ vars.DEV_URL }}
      alias: ${{ vars.DEV_DOMAIN }}
    secrets: inherit

  mark:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark the commit as deployed to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=deploy-dev \
            -f description="Deployed to DEV and healthy" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
