# Weekly dependency updates, one grouped pull request per ecosystem, into DEV-BCMTOOLS.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: DEV-BCMTOOLS
    schedule: {interval: weekly, day: monday, time: "08:00", timezone: Asia/Jakarta}
    groups:
      npm: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    target-branch: DEV-BCMTOOLS
    schedule: {interval: weekly, day: monday, time: "08:00", timezone: Asia/Jakarta}
    groups:
      actions: {patterns: ["*"]}
